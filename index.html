<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Temporizador Pomodoro construido con HTML5, CSS3 y JavaScript Vanilla.">
  <meta name="color-scheme" content="dark">
  <title>Pomodoro</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-mode="work">

  <div class="app" id="app" data-mode="work">

    <header class="app-header">
      <h1 class="app-title">Pomodoro</h1>
      <div class="header-actions">
        <button type="button" id="btn-lang" class="ghost-btn" data-i18n="langButton" data-i18n-aria="langAria">English</button>
        <button type="button" id="btn-notifications" class="ghost-btn icon-btn" aria-pressed="false" aria-label="Activar notificaciones del navegador">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>
      </div>
    </header>

    <nav class="mode-tabs" aria-label="Seleccionar modo del temporizador" data-i18n-aria="tabsAria">
      <button type="button" class="mode-tab is-active" data-mode="work" aria-pressed="true" data-i18n="modeWork">Trabajo</button>
      <button type="button" class="mode-tab" data-mode="short" aria-pressed="false" data-i18n="modeShort">Descanso corto</button>
      <button type="button" class="mode-tab" data-mode="long" aria-pressed="false" data-i18n="modeLong">Descanso largo</button>
    </nav>

    <section class="timer-panel" aria-labelledby="mode-label">
      <div class="progress-ring">
        <svg class="ring-svg" viewBox="0 0 240 240" aria-hidden="true" focusable="false">
          <circle class="ring-track" cx="120" cy="120" r="108"></circle>
          <circle class="ring-progress" id="ring-progress" cx="120" cy="120" r="108"></circle>
        </svg>
        <div id="time-display" class="time-display" role="timer">25:00</div>
      </div>
      <p id="mode-label" class="mode-label" data-i18n="modeWork">Trabajo</p>
    </section>

    <div class="controls">
      <button type="button" id="btn-start-pause" class="primary-btn">
        <span class="btn-label" data-i18n="start">Iniciar</span>
      </button>
      <button type="button" id="btn-reset" class="secondary-btn" data-i18n="reset">Reiniciar</button>
    </div>

    <section class="session-panel" aria-label="Progreso de la sesión">
      <p id="cycle-dots" class="cycle-dots" role="img">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </p>
      <p class="counter-line">
        <span id="pomodoro-count" class="counter-value">0</span>
        <span data-i18n="completedLabel">pomodoros completados</span>
      </p>
      <p id="long-break-hint" class="hint">Descanso largo cada 4 pomodoros</p>
    </section>

  </div>

  <p id="status-region" class="visually-hidden" role="status" aria-live="assertive"></p>

  <footer class="app-footer">
    <p data-i18n="madeWith">Hecho con HTML5, CSS3 y JavaScript Vanilla</p>
  </footer>

  <script src="js/state.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
